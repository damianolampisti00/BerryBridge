domain wacalls.local
sip-proxy 127.0.0.1:5060
stun-udp 127.0.0.1:3478
stun-tcp 127.0.0.1:3478
set-transport-mode tcp
keyframeinterval 15
media_threshold 20000
port-min 45535
port-max 65535
dialog
useccx
usebbid
verbosity 5
tcp-timeout 10000
version 3.3.0
udp_stun_timeout 28000
tcp_stun_timeout 28000
udp_stun_limit 7
udp_stun_rm 16
use_new_ringer
mediacallapi
proxy_keepalive_secs 270
audio_thread_priority 21
audiocodecs OPUS PROVOICE OPUS-WB SPEEX-WB PCMU
la_audiocodecs OPUS-WB PCMU
group_wifi wifi
group_cellular cellular
app_bundled 1
enableBBMRestrictions 0
BBIDIncomingPolicy 0
BBIDOutgoingPolicy 0
useEarlyIce 1
